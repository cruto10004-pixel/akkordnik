<!DOCTYPE html>
<html lang="ru" data-theme="sunset">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cut">
<meta name="theme-color" content="#120D0B">
<title>Аккордник</title>
<link rel="stylesheet" href="fonts.css">
<script src="capacitor.js"></script>
<style>
html[data-theme=sunset]{--bg:#120D0B;--surface:#1D1613;--raised:#2A201B;--line:rgba(255,236,220,.11);--text:#FFF4EA;--muted:rgba(255,244,234,.64);--accent:#FFB547;--a1:#FF9A3D;--a2:#FF3D6E;--on-grad:#1A0B05;--sec:#FF6B85;--g1:rgba(255,128,50,.34);--g2:rgba(255,50,110,.26);--meta:#120D0B}
html[data-theme=night]{--bg:#0A0A1C;--surface:#14142C;--raised:#1E1E3E;--line:rgba(200,205,255,.12);--text:#F5F6FF;--muted:rgba(235,238,255,.64);--accent:#4ADE80;--a1:#A06BFF;--a2:#5B5FF0;--on-grad:#FFFFFF;--sec:#A5B4FC;--g1:rgba(110,90,255,.36);--g2:rgba(34,197,94,.20);--meta:#0A0A1C}
html[data-theme=ocean]{--bg:#061318;--surface:#0C1F27;--raised:#142F3A;--line:rgba(190,240,255,.12);--text:#EFFBFF;--muted:rgba(225,247,255,.64);--accent:#5EEAD4;--a1:#2BD9F0;--a2:#3B82F6;--on-grad:#031018;--sec:#7DD3FC;--g1:rgba(34,211,238,.30);--g2:rgba(59,130,246,.28);--meta:#061318}
html[data-theme=neon]{--bg:#11061A;--surface:#1D0E2A;--raised:#2B163C;--line:rgba(250,210,255,.12);--text:#FFF2FD;--muted:rgba(255,235,252,.64);--accent:#FF7AC6;--a1:#E048FB;--a2:#FF4D8D;--on-grad:#1A0614;--sec:#D29BFF;--g1:rgba(224,72,251,.32);--g2:rgba(255,77,141,.26);--meta:#11061A}
html[data-theme=paper]{--bg:#FBF6EF;--surface:#FFFFFF;--raised:#F2EADF;--line:rgba(60,40,20,.12);--text:#221912;--muted:rgba(34,25,18,.64);--accent:#C2410C;--a1:#FB923C;--a2:#F43F5E;--on-grad:#1F0A04;--sec:#BE123C;--g1:rgba(251,146,60,.26);--g2:rgba(244,63,94,.16);--meta:#FBF6EF;--danger:#C81E1E}
:root{--grad:linear-gradient(135deg,var(--a1),var(--a2));--display:"Unbounded",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--r:14px;--lyric:18px;--spring:cubic-bezier(.2,.9,.25,1.18);--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;touch-action:manipulation;background:var(--bg);color:var(--text);font:16px/1.5 var(--body);transition:background .4s,color .4s}
body{min-height:100dvh;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.glow i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.9}
.glow i:nth-child(1){background:radial-gradient(circle,var(--g1),transparent 62%);top:-38vmax;left:-22vmax;animation:float1 18s ease-in-out infinite alternate}
.glow i:nth-child(2){background:radial-gradient(circle,var(--g2),transparent 62%);bottom:-44vmax;right:-28vmax;animation:float2 22s ease-in-out infinite alternate}
@keyframes float1{to{transform:translate(12vmax,10vmax) scale(1.1)}}
@keyframes float2{to{transform:translate(-10vmax,-12vmax) scale(1.15)}}
#app,#float{position:relative;z-index:1}
.view{max-width:760px;margin:0 auto;min-height:100dvh}
.view.fwd{animation:inFwd .42s var(--ease) both}
.view.back{animation:inBack .42s var(--ease) both}
.view.fade{animation:fadeIn .5s var(--ease) both}
@keyframes inFwd{from{opacity:0;transform:translateX(36px)}}
@keyframes inBack{from{opacity:0;transform:translateX(-36px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}}
.stag>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms + 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes bump{50%{transform:scale(1.35)}}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.press{transition:transform .18s var(--spring),background .2s,border-color .2s,box-shadow .2s,filter .2s}
.press:active{transform:scale(.94)}
.btn-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.btn-icon:hover{background:var(--raised)}
.btn{min-height:50px;padding:0 20px;border-radius:14px;border:0;background:var(--grad);color:var(--on-grad);font-weight:800;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 8px 24px -8px var(--a2)}
.btn:hover{filter:brightness(1.08) saturate(1.1)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;color:var(--danger,#FF6B6B);border:1px solid color-mix(in srgb,var(--danger,#FF6B6B) 45%,transparent);box-shadow:none}
.gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* list */
.top{padding:28px 20px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand small{display:block;color:var(--muted);font-weight:700;font-size:14px}
.brand h1{margin:4px 0 0;font:800 32px/1.1 var(--display);letter-spacing:-.01em}
.search{margin:8px 20px 16px;position:relative}
.search .icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:52px;padding:0 16px 0 48px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.count{padding:0 20px 8px;color:var(--muted);font-size:14px;font-weight:600}
.list{list-style:none;margin:0;padding:0 12px 130px}
.song{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:16px;cursor:pointer}
.song:hover{background:var(--surface)}
.cover{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font:800 20px var(--display);color:#fff;flex:none;text-shadow:0 1px 6px rgba(0,0,0,.25);box-shadow:0 6px 18px -8px rgba(0,0,0,.6)}
.song .meta{flex:1;min-width:0}
.song .t{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .a{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px;background:var(--grad);color:var(--on-grad);white-space:nowrap}
.tag.none{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:48px 24px}
.fab{position:fixed;right:max(20px,calc(50% - 360px));bottom:calc(22px + env(safe-area-inset-bottom));height:58px;padding:0 24px;border-radius:18px;z-index:5;animation:pop .5s var(--spring) .25s both}

/* song */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px}
.bar .ttl{flex:1;min-width:0}
.bar .ttl b{display:block;font:700 16px/1.25 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl span{color:var(--muted);font-size:13px}
.head{padding:16px 20px 4px}
.capo{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:18px;background:var(--grad);color:var(--on-grad)}
.capo::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.8s var(--ease) .5s 1 both}
@keyframes shine{to{transform:translateX(100%)}}
.capo .n{font:800 34px/1 var(--display);min-width:40px;text-align:center}
.capo b{display:block;font-size:17px}
.capo span{opacity:.8;font-size:14px;font-weight:600}
.capo.none{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.capo.none .n{color:var(--muted)}
.capo.none::after{display:none}
.lbl{margin:20px 0 10px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lbl em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:58px;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:800 16px var(--mono);color:var(--accent);flex:none}
.chip:hover{border-color:var(--accent);background:var(--raised)}
.chips .chip{animation:pop .45s var(--spring) both;animation-delay:calc(var(--i,0)*40ms + 150ms)}
.chip.add{color:var(--text);border-style:dashed;display:inline-flex;align-items:center;gap:6px;font-family:var(--body);font-size:15px}
.lyrics{padding:12px 20px 170px;font-size:var(--lyric);transition:font-size .25s var(--ease)}
.sec{margin:24px 0 6px;font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--sec)}
.ln{display:flex;flex-wrap:wrap;align-items:flex-end;min-height:1.5em;margin-bottom:4px}
.seg{display:inline-flex;flex-direction:column;white-space:pre}
.seg .c{font:800 .84em/1.3 var(--mono);color:var(--accent);background:none;border:0;padding:0 .35em 0 0;text-align:left;cursor:pointer;min-height:1.3em;transition:transform .2s var(--spring)}
.seg button.c:active{transform:scale(.88)}
.seg .w{line-height:1.45}
.ln.has-chords{margin-top:6px}
.tools{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:4px;align-items:center;padding:6px;border-radius:20px;background:var(--raised);border:1px solid var(--line);box-shadow:0 14px 40px -10px rgba(0,0,0,.6);transform:translateX(-50%);animation:toolsIn .55s var(--spring) .15s both}
@keyframes toolsIn{from{opacity:0;transform:translate(-50%,40px)}}
.tools .grp{display:flex;align-items:center;gap:2px}
.tools .val{min-width:36px;text-align:center;font-weight:800;font-size:15px;line-height:1.1;display:inline-block}
.tools .val small{display:block;font-size:10px;font-weight:700;color:var(--muted)}
.tools .val.bump{animation:bump .3s var(--spring)}
.tools .btn-icon{border:0;background:transparent}
.tools .btn-icon:hover{background:var(--surface)}
.tools .btn-icon.on{background:var(--grad);color:var(--on-grad)}
.tools .sep{width:1px;height:28px;background:var(--line)}
.stage .bar,.stage .head{display:none}
.stage .lyrics{padding-top:28px}
.playing{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--a2) 35%,transparent)}}

/* sheet & dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:20;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:21;width:min(500px,100%);max-height:92dvh;overflow:auto;transform:translate(-50%,110%);visibility:hidden;transition:transform .5s var(--spring),visibility 0s .5s;background:var(--surface);border-radius:26px 26px 0 0;border:1px solid var(--line);padding:10px 20px calc(22px + env(safe-area-inset-bottom))}
.sheet.open{transform:translate(-50%,0);visibility:visible;transition:transform .5s var(--spring)}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0;font:800 38px/1 var(--display);text-align:center}
.sheet p.sub{margin:6px 0 0;text-align:center;color:var(--muted);font-size:14px}
.seg-ctl{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--bg);border:1px solid var(--line);margin:16px 0 8px;position:relative}
.seg-ctl button{flex:1;height:40px;border:0;border-radius:10px;background:transparent;font-weight:800;font-size:14px;color:var(--muted);position:relative;z-index:1;transition:color .25s}
.seg-ctl button.on{color:var(--on-grad)}
.seg-ctl .thumb{position:absolute;top:4px;bottom:4px;border-radius:10px;background:var(--grad);transition:left .4s var(--spring),width .4s var(--spring)}
.viz{min-height:290px;display:grid;place-items:center}
.viz>*{animation:fadeIn .35s var(--ease) both}
.diagram{display:block;width:230px;height:auto}
.dot{transform-box:fill-box;transform-origin:center;animation:pop .45s var(--spring) both}
.neck{display:block;width:100%;height:auto;border-radius:14px}
.photo{width:100%;max-height:52dvh;object-fit:contain;border-radius:16px;background:var(--bg)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
.nav .btn{flex:1}
.mini{display:flex;gap:8px;margin-top:10px}
.mini .btn{flex:1;min-height:46px;font-size:15px;white-space:nowrap;padding:0 12px}
.dialog{position:fixed;left:50%;top:50%;z-index:31;width:min(380px,calc(100% - 40px));transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;transition:transform .4s var(--spring),opacity .25s;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px}
.dialog.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.dialog h4{margin:0 0 6px;font:700 19px/1.3 var(--display)}
.dialog p{margin:0 0 18px;color:var(--muted)}
.dialog .acts{display:grid;gap:8px}
#dscrim{z-index:30}

/* form */
.form{padding:16px 20px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.form>*,.field{min-width:0}
.field>label,.field>.flabel{display:block;font-weight:800;font-size:14px;margin-bottom:8px}
.inp{width:100%;min-height:52px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);outline:none;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea.inp{min-height:300px;font:15px/1.65 var(--mono);resize:vertical}
.hint{color:var(--muted);font-size:14px;margin-top:8px}
.hint code{color:var(--accent);font-family:var(--mono);font-weight:700}
.ins{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ins .chip{height:42px;min-width:50px;font-size:14px}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.actions .btn{flex:1}
/* capo picker */
.capo-pick{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:4px 20px 14px;scroll-padding:0 20px;scroll-snap-type:x proximity;scrollbar-width:none}
.capo-pick::-webkit-scrollbar{display:none}
.fret{flex:none;scroll-snap-align:center;width:58px;height:66px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.fret b{font:800 20px/1 var(--display)}
.fret span{font-size:11px;font-weight:700;color:var(--muted)}
.fret.on{background:var(--grad);color:var(--on-grad);border-color:transparent;box-shadow:0 8px 22px -8px var(--a2);transform:translateY(-2px)}
.fret.on span{color:inherit;opacity:.8}
.fret.wide{width:86px}
/* settings */
.sect{margin:8px 20px 22px}
.sect h2{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.rowi{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:60px}
.rowi+.rowi{border-top:1px solid var(--line)}
.rowi .tx{flex:1;min-width:0}
.rowi .tx b{display:block;font-weight:700}
.rowi .tx span{display:block;color:var(--muted);font-size:14px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.th{border:2px solid var(--line);border-radius:18px;padding:10px;text-align:left;background:var(--surface)}
.th.on{border-color:var(--accent)}
.th .sw{height:64px;border-radius:12px;position:relative;overflow:hidden;margin-bottom:8px}
.th .sw i{position:absolute;left:10px;right:30px;height:8px;border-radius:4px}
.th b{font-weight:800;font-size:14px}
.th .ck{float:right;width:20px;height:20px;border-radius:50%;background:var(--grad);display:none;place-items:center;color:var(--on-grad)}
.th.on .ck{display:grid;animation:pop .35s var(--spring)}
.toggle{width:52px;height:32px;border-radius:999px;border:0;background:var(--raised);position:relative;flex:none;transition:background .3s}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .35s var(--spring);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.toggle.on{background:var(--grad)}
.toggle.on::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper output{min-width:40px;text-align:center;font-weight:800}
.segsm{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.segsm button{height:36px;min-width:44px;border:0;border-radius:9px;background:transparent;font-weight:800;color:var(--muted)}
.segsm button.on{background:var(--grad);color:var(--on-grad)}
.mychords{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.mc{flex:none;width:96px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:8px;text-align:center}
.mc.add .icon{width:26px;height:26px}
.mc svg:not(.icon),.mc img{width:100%;height:84px;object-fit:cover;border-radius:8px;display:block}
.mc b{display:block;font:800 14px var(--mono);color:var(--accent);margin-top:4px}
.mc.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-style:dashed;color:var(--muted);font-weight:700;font-size:13px;min-height:126px}
/* chord editor */
.editor{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.editor svg{display:block;width:100%;max-width:340px;margin:0 auto;touch-action:manipulation}
.editor .cell{cursor:pointer}
.photo-box{border:1px dashed var(--line);border-radius:18px;padding:12px;display:grid;gap:10px;place-items:center;background:var(--surface);min-height:120px}
.photo-box img{width:100%;max-height:300px;object-fit:contain;border-radius:12px}
.prog{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.pl{display:flex;gap:12px;align-items:center;padding:10px 0}
.pl+.pl{border-top:1px solid var(--line)}
.pk{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sec);width:78px;flex:none;overflow-wrap:anywhere}
.pc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.pc .chip{height:40px;min-width:46px;font-size:15px;padding:0 10px;animation:pop .45s var(--spring) both;animation-delay:calc(var(--i,0)*30ms + 200ms)}
.pc .nz{color:var(--muted);font-weight:800;font-size:14px}
.segsm.full{width:100%}
.segsm.full button{flex:1;height:44px;font-size:14px}
[data-mode=inline] .only-simple{display:none}
.imp{padding:16px 20px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.imp .card{padding:16px}
.imp h3{margin:0 0 4px;font:700 17px/1.3 var(--display)}
.imp p{margin:0 0 12px;color:var(--muted);font-size:14px}
.urlrow{display:flex;gap:8px}
.urlrow .inp{flex:1;min-width:0}
.sites{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sites span{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.status{display:none;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--raised);font-size:14px;font-weight:600}
.status.show{display:flex;animation:fadeIn .3s var(--ease)}
.status.err{background:color-mix(in srgb,var(--danger,#FF6B6B) 14%,transparent);color:var(--text)}

const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

const OPEN={
 'C':[-1,3,2,0,1,0],'C7':[-1,3,2,3,1,0],'Cmaj7':[-1,3,2,0,0,0],
 'D':[-1,-1,0,2,3,2],'Dm':[-1,-1,0,2,3,1],'D7':[-1,-1,0,2,1,2],'Dm7':[-1,-1,0,2,1,1],'Dsus4':[-1,-1,0,2,3,3],'Dsus2':[-1,-1,0,2,3,0],
 'E':[0,2,2,1,0,0],'Em':[0,2,2,0,0,0],'E7':[0,2,0,1,0,0],'Em7':[0,2,2,0,3,0],
 'G':[3,2,0,0,0,3],'G7':[3,2,0,0,0,1],
 'A':[-1,0,2,2,2,0],'Am':[-1,0,2,2,1,0],'A7':[-1,0,2,0,2,0],'Am7':[-1,0,2,0,1,0],'Asus4':[-1,0,2,2,3,0],'Asus2':[-1,0,2,2,0,0],'Amaj7':[-1,0,2,1,2,0],

function customFor(name){const k=canon(name); return db.chords[k]||db.chords[name]||null}
function voicing(name){
  const cu=customFor(name);
  if(cu&&cu.frets) return Object.assign({key:canon(name),custom:true},cu,barreInfo(cu.frets,cu.barre));
  const p=parseChord(name); if(!p) return null;
  const q=p.q, known=q in SHAPE, base=known?q:(/^m(?!aj)/.test(q)?'m':'');
  const key=noteName(p.root)+base, full=noteName(p.root)+q;
  if(OPEN[full]) return {frets:OPEN[full],key:full,photo:cu&&cu.photo};
  if(!known&&OPEN[key]) return {frets:OPEN[key],simplified:true,key,photo:cu&&cu.photo};
  const fE=(p.root-4+12)%12||12, fA=(p.root-9+12)%12||12, useA=fA<fE, f=useA?fA:fE;

function barreInfo(frets,on){ if(!on) return {barre:0}; const pl=frets.filter(f=>f>0); if(!pl.length) return {barre:0};
  const b=Math.min(...pl); return {barre:b,barreFrom:frets.findIndex(f=>f===b)} }
function fingers(v){ // simple fingering: barre=1, rest by fret then string
  const res=v.frets.map(()=>0); let next=1;
  if(v.barre){v.frets.forEach((f,s)=>{if(f===v.barre&&s>=v.barreFrom)res[s]=1});next=2}
  const notes=v.frets.map((f,s)=>({f,s})).filter(n=>n.f>0&&!res[n.s]).sort((a,b)=>a.f-b.f||a.s-b.s);

function bounds(frets){const pl=frets.filter(f=>f>0); const max=Math.max(...pl,1),min=Math.min(...pl,99); return max<=5?1:min}
function diagramSVG(v,o={}){
  const W=230,H=280,x0=42,y0=50,sw=29,fh=40,N=5,start=bounds(v.frets),F=fingers(v),P=[];
  const stroke='currentColor';

// realistic neck view (as if looking at the guitar): high e on top
function neckSVG(v){

  for(let r=0;r<6;r++){const s=5-r, y=y0+r*sg, w=1.2+s*.45; P.push(`<rect x="${x0-10}" y="${y-w/2}" width="${W-x0+4}" height="${w}" fill="url(#str)"/>`)}

      P.push(`<g class="dot" style="animation-delay:${d++*80+150}ms" filter="url(#sh)"><ellipse cx="${x}" cy="${y}" rx="15" ry="13" fill="url(#tip)"/>${F?`<text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="800" fill="#5B2E1C" font-family="Manrope,sans-serif">${F[s]}</text>`:''}</g>`)}
  });
  ['e','B','G','D','A','E'].forEach((n,r)=>P.push(`<text x="16" y="${y0+r*sg+5}" text-anchor="middle" font-size="13" font-weight="700" fill="rgba(255,240,220,.6)" font-family="Manrope,sans-serif">${n}</text>`));
  P.push('</svg>'); return P.join('');
}

/* ---------- progression (simple mode) ---------- */
const CH_RE=/^\(?\[?([A-H][#b]?)(maj|min|m|dim|aug|sus|add|M)?(\d{0,2})(sus\d|add\d{1,2}|maj\d|b5|#5|b9|#9|\+|°|ø)*(\/[A-H][#b]?)?\]?\)?$/;
const cleanTok=t=>t.replace(/[()\[\]]/g,'');
function parseProg(prog){
  return String(prog||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    let label='',rest=l; const m=/^([^:]{1,30}):\s*(.*)$/.exec(l); if(m&&!CH_RE.test(m[1].trim())){label=m[1].trim();rest=m[2]}
    return {label,items:rest.split(/\s+/).filter(Boolean).map(t=>CH_RE.test(t)?{c:cleanTok(t)}:{t})};
  });
}
function songChords(s,tr=0){const set=[];
  parseProg(s.prog).forEach(l=>l.items.forEach(i=>{if(i.c){const c=transpose(i.c,tr);if(!set.includes(c))set.push(c)}}));
  chordsOf(s.text).forEach(c=>{c=transpose(c,tr);if(!set.includes(c))set.push(c)}); return set}

/* ---------- lyrics ---------- */
function chordsOf(text){const set=[];(text.match(/\[([^\]]+)\]/g)||[]).forEach(m=>{const c=m.slice(1,-1).trim();if(c&&!set.includes(c))set.push(c)});return set}
function renderLyrics(text,tr){
  return text.split('\n').map(line=>{
    if(/^#/.test(line)) return `<div class="sec">${esc(line.replace(/^#\s*/,''))}</div>`;
    if(!line.trim()) return '<div class="ln"></div>';
    const re=/\[([^\]]+)\]/g; let segs=[],last=0,cur=null,m;
    while((m=re.exec(line))){segs.push({c:cur,w:line.slice(last,m.index)});cur=m[1];last=re.lastIndex}
    segs.push({c:cur,w:line.slice(last)}); segs=segs.filter(s=>s.c||s.w);
    const has=segs.some(s=>s.c);
    return `<div class="ln${has?' has-chords':''}">`+segs.map(s=>{const c=s.c?transpose(s.c,tr):'';
      return `<span class="seg">${has?(c?`<button class="c" data-chord="${esc(c)}">${esc(fmt(c))}</button>`:'<span class="c">&nbsp;</span>'):''}<span class="w">${esc(s.w)||'&nbsp;'}</span></span>`}).join('')+'</div>';
  }).join('');
}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2000)}
function ask(title,text,buttons){return new Promise(res=>{
  const d=$('#dialog'); d.innerHTML=`<h4>${esc(title)}</h4><p>${esc(text)}</p><div class="acts">${buttons.map((b,i)=>`<button class="btn press ${b.cls||''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div>`;
  const close=v=>{d.classList.remove('open');$('#dscrim').classList.remove('open');res(v)};
  d.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>close(buttons[+b.dataset.i].value));
  $('#dscrim').onclick=()=>close(null);

})}
function plural(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c}
const GRADS=[['#FF9A3D','#FF3D6E'],['#A06BFF','#5B5FF0'],['#2BD9F0','#3B82F6'],['#E048FB','#FF4D8D'],['#34D399','#0EA5E9'],['#FBBF24','#F97316'],['#F472B6','#A855F7']];
const coverGrad=s=>{const g=GRADS[[...String(s.id)].reduce((a,c)=>a+c.charCodeAt(0),0)%GRADS.length];return `linear-gradient(135deg,${g[0]},${g[1]})`};
function compressImage(file,max=900){return new Promise((res,rej)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); let out=c.toDataURL('image/webp',.78); if(!out.startsWith('data:image/webp')) out=c.toDataURL('image/jpeg',.8); res(out)};
  img.onerror=rej; img.src=url})}
function pickImage(){return new Promise(res=>{const f=$('#filePick');f.value='';f.onchange=async()=>{if(!f.files[0])return res(null);try{res(await compressImage(f.files[0]))}catch(e){toast('Не удалось открыть фото');res(null)}};f.click()})}

/* ---------- import ---------- */
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};
const SECT=/^\s*\[?\s*((?:пре-?припев|куплет|припев|вступление|интро|проигрыш|бридж|кода|окончание|концовка|соло|аутро|intro|verse|pre-?chorus|chorus|bridge|outro|solo|interlude)[^\]:\n]{0,20}?)\s*\]?\s*:?\s*(?=\S|$)(.*)$/i;
const NOISE=/^(?:[xх×*]\s?\d+|\d+\s?[xх×]?|раза?|\}\s?[xх×]?\d*|\{|\|+|-+|—|–|\(|\)|\.{2,}|:|\/)$/i;
function isChordLine(l){const t=l.trim().split(/\s+/).filter(Boolean); if(!t.length) return false; return t.some(x=>CH_RE.test(x))&&t.every(x=>CH_RE.test(x)||NOISE.test(x))}
function mergeLine(cl,ll){const pos=[];cl.replace(/\S+/g,(t,i)=>{pos.push([i,t]);return t});
  let s=ll; const need=Math.max(...pos.map(p=>p[0]))+1; if(s.length<need) s=s.padEnd(need,' ');
  for(let k=pos.length-1;k>=0;k--){const [i,t]=pos[k]; if(CH_RE.test(t)) s=s.slice(0,i)+'['+cleanTok(t)+']'+s.slice(i)}
  return s.replace(/\s+$/,'').replace(/^\s+/,'')}
const chordOnly=l=>l.trim().split(/\s+/).map(t=>CH_RE.test(t)?'['+cleanTok(t)+']':t).join(' ');
function textToInline(raw){
  const L=String(raw).replace(/\r/g,'').replace(/\t/g,'    ').replace(/\u00a0/g,' ').split('\n').map(l=>l.replace(/\s+$/,''));
  const out=[];
  for(let i=0;i<L.length;i++){let l=L[i];
    if(/^\s*\[[A-H][^\]]*\]/.test(l)&&!isChordLine(l)){out.push(l.trim());continue} // already inline format
    const sm=!isChordLine(l)&&SECT.exec(l);
    if(sm){let lab=sm[1].trim(); l=sm[2]||''; const nm=/^(\d+)\s*[:.)]?\s*(.*)$/.exec(l); if(nm){lab+=' '+nm[1]; l=nm[2]} out.push('# '+lab); if(!l.trim()) continue}
    const note=l.match(/\([^)\n]{1,20}\)/g); if(note&&!isChordLine(l)){const st=l.replace(/\([^)\n]{1,20}\)/g,m=>' '.repeat(m.length)); if(isChordLine(st)){out.push(note.join(' ')); l=st}}
    if(isChordLine(l)){const nx=L[i+1];
      if(nx!==undefined&&nx.trim()&&!isChordLine(nx)&&!SECT.test(nx)){out.push(mergeLine(l,nx));i++}
      else out.push(chordOnly(l))}
    else out.push(l.trim()?l.replace(/^\s+/,''):'');
  }
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function findCapo(t){const m=/(?:капо(?:дастр)?|capo)[^\d\n]{0,25}?(\d{1,2})/i.exec(t||''); const n=m?+m[1]:0; return n>=1&&n<=12?n:0}
function cleanTitle(t){return String(t||'').replace(/\s+/g,' ').replace(/\s*[:,|\-–—]?\s*(аккорды|подбор|табы|разбор|текст и аккорды|chords|tabs)\b.*$/i,'').trim()}
function htmlToSong(html,url){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const jsonld=[...doc.querySelectorAll('script[type="application/ld+json"]')].map(e=>e.textContent);
  doc.querySelectorAll('script,style,noscript,svg,iframe,form,#comments,.comments,.comment').forEach(e=>e.remove());
  const cands=[...doc.querySelectorAll('pre[itemprop=chordsBlock],.podbor__text,p.chords,div.chords,pre,.song-text,#song_text,.chords-text,[class*=chord-text],[class*=song_text],[class*=songtext],[itemprop=text]')];
  let best=null,score=0;
  for(const el of cands){el.querySelectorAll('br').forEach(b=>b.replaceWith('\n'));
    el.querySelectorAll('div,p').forEach(d=>{if(d.closest('pre,p.chords')&&/podbor__keyword/.test(d.className))d.append('\n')});

  if(!title||!artist){for(const sc of jsonld){try{const walk=o=>{if(!o||typeof o!=='object')return; if(Array.isArray(o)){o.forEach(walk);return}
      const ty=[].concat(o['@type']||[]); if(ty.includes('MusicRecording')||ty.includes('MusicComposition')){if(!title&&o.name)title=o.name; const ba=o.byArtist; if(!artist&&ba)artist=(Array.isArray(ba)?ba[0]:ba).name||''}
